        <rect x="923" y="122" width="2" height="2"/>
        <rect x="938" y="134" width="2" height="2"/>
        <rect x="930" y="152" width="2" height="2"/>
        <rect x="984" y="132" width="2" height="2"/>
        <rect x="996" y="150" width="2" height="2"/>
        <rect x="1046" y="118" width="2" height="2"/>
        <rect x="1062" y="130" width="2" height="2"/>
        <rect x="1052" y="150" width="2" height="2"/>
        <rect x="1112" y="130" width="2" height="2"/>
        <rect x="1124" y="148" width="2" height="2"/>
        <rect x="1178" y="138" width="2" height="2"/>
      </g>
      <g fill="#4cc9ff" opacity=".7">
        <rect x="598" y="152" width="2" height="2"/>
        <rect x="742" y="150" width="2" height="2"/>
        <rect x="806" y="146" width="2" height="2"/>
        <rect x="894" y="142" width="2" height="2"/>
