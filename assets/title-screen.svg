        <rect x="1086" y="144" width="2" height="2"/>
        <rect x="1148" y="152" width="2" height="2"/>
      </g>
    </g>
    <rect x="500" y="169.5" width="700" height="1" fill="url(#horizon)"/>

    <polygon points="861,170 879,170 1130,400 610,400" fill="url(#road)"/>
    <path d="M861 170 610 400M879 170 1130 400" stroke="#3a4560" stroke-width="2" fill="none"/>

    <g fill="#e8ecf4">
      <g class="moving dash"><rect x="841.5" y="230" width="3" height="24" transform="rotate(20.7 843 242)"/><rect x="895.5" y="230" width="3" height="24" transform="rotate(-20.7 897 242)"/></g>
      <g class="moving dash" style="animation-delay: -.3s"><rect x="841.5" y="230" width="3" height="24" transform="rotate(20.7 843 242)"/><rect x="895.5" y="230" width="3" height="24" transform="rotate(-20.7 897 242)"/></g>
      <g class="moving dash" style="animation-delay: -.6s"><rect x="841.5" y="230" width="3" height="24" transform="rotate(20.7 843 242)"/><rect x="895.5" y="230" width="3" height="24" transform="rotate(-20.7 897 242)"/></g>
      <g class="moving dash" style="animation-delay: -.9s"><rect x="841.5" y="230" width="3" height="24" transform="rotate(20.7 843 242)"/><rect x="895.5" y="230" width="3" height="24" transform="rotate(-20.7 897 242)"/></g>
      <g class="moving dash" style="animation-delay: -1.2s"><rect x="841.5" y="230" width="3" height="24" transform="rotate(20.7 843 242)"/><rect x="895.5" y="230" width="3" height="24" transform="rotate(-20.7 897 242)"/></g>
      <g class="moving dash" style="animation-delay: -1.5s"><rect x="841.5" y="230" width="3" height="24" transform="rotate(20.7 843 242)"/><rect x="895.5" y="230" width="3" height="24" transform="rotate(-20.7 897 242)"/></g>
