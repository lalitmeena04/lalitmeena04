<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Lalit Kumar Meena: Player 1 ready</title>
  <desc id="desc">A game title screen. A car drives down a night road collecting skills: C++, Qt, QML, Three.js and Vue.</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="400" rx="18"/></clipPath>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#fff" stroke-opacity=".03"/>
    </pattern>
    <radialGradient id="glow" cx="870" cy="170" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4cc9ff" stop-opacity=".26"/>
      <stop offset=".4" stop-color="#4cc9ff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#4cc9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="170" x2="0" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c2334"/>
      <stop offset="1" stop-color="#10141d"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="345" x2="0" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8ecf4" stop-opacity=".2"/>
      <stop offset="1" stop-color="#e8ecf4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="horizon" x1="500" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a4560" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a4560"/>
    </linearGradient>
    <linearGradient id="fadeIn" x1="540" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="skylineFade" maskUnits="userSpaceOnUse" x="520" y="90" width="680" height="90">
      <rect x="520" y="90" width="680" height="90" fill="url(#fadeIn)"/>
    </mask>
    <filter id="soft" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <style>
    .mono { font-family: ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace; font-weight: 700; }
    .display { font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
    .moving { transform-box: view-box; transform-origin: 870px 170px; animation-iteration-count: infinite; animation-fill-mode: both; animation-timing-function: cubic-bezier(.6, 0, .9, .4); }
    .dash { animation-name: approach; animation-duration: 1.8s; }
    .pickup { animation-name: collect; animation-duration: 7s; }
    .ring { transform-box: view-box; transform-origin: 870px 322px; animation: ring 1.4s ease-out infinite; }
    .car { animation: bob .5s ease-in-out infinite alternate; }
    .blink { animation: blink 1.2s steps(1) infinite; }
    .star { animation: twinkle 3.2s ease-in-out infinite alternate; }
    @keyframes approach { 0% { transform: scale(.04); opacity: 0; } 12% { opacity: .5; } 100% { transform: scale(4.2); opacity: .5; } }
    @keyframes collect { 0% { transform: scale(.04); opacity: 0; } 6% { opacity: 1; } 90% { opacity: 1; } 100% { transform: scale(2.25); opacity: 0; } }
    @keyframes ring { 0% { transform: scale(.4); opacity: .8; } 40%, 100% { transform: scale(4.5); opacity: 0; } }
    @keyframes bob { to { transform: translateY(1.2px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes twinkle { to { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) {
      .moving, .ring, .car, .blink, .star { animation: none; }
      .pickup, .ring { display: none; }
      .pickup.first { display: inline; transform: scale(1.5); }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="#090b10"/>
    <rect width="1200" height="400" fill="url(#grid)"/>
    <rect width="1200" height="400" fill="url(#glow)"/>

    <g fill="#e8ecf4">
      <circle class="star" cx="586" cy="42" r="1.2"/>
      <circle class="star" cx="652" cy="96" r="1" style="animation-delay: -1.1s"/>
      <circle class="star" cx="704" cy="34" r="1.4" style="animation-delay: -2.3s"/>
      <circle class="star" cx="762" cy="78" r="1" style="animation-delay: -.6s"/>
      <circle class="star" cx="818" cy="28" r="1.1" style="animation-delay: -1.8s"/>
      <circle class="star" cx="884" cy="62" r="1.3" style="animation-delay: -2.9s"/>
