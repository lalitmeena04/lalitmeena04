    <polygon points="826,345 914,345 884,190 856,190" fill="url(#beam)"/>

    <g class="mono" font-size="10" text-anchor="middle">
      <g class="moving pickup first"><rect x="840" y="227" width="60" height="18" rx="4" fill="#11151d" stroke="#c4f542"/><text x="870" y="239.5" fill="#c4f542">C++</text></g>
      <g class="moving pickup" style="animation-delay: -1.4s"><rect x="840" y="227" width="60" height="18" rx="4" fill="#11151d" stroke="#4cc9ff"/><text x="870" y="239.5" fill="#4cc9ff">Qt</text></g>
      <g class="moving pickup" style="animation-delay: -2.8s"><rect x="840" y="227" width="60" height="18" rx="4" fill="#11151d" stroke="#4cc9ff"/><text x="870" y="239.5" fill="#4cc9ff">QML</text></g>
      <g class="moving pickup" style="animation-delay: -4.2s"><rect x="840" y="227" width="60" height="18" rx="4" fill="#11151d" stroke="#ffcb47"/><text x="870" y="239.5" fill="#ffcb47">Three.js</text></g>
      <g class="moving pickup" style="animation-delay: -5.6s"><rect x="840" y="227" width="60" height="18" rx="4" fill="#11151d" stroke="#ff5d73"/><text x="870" y="239.5" fill="#ff5d73">Vue</text></g>
    </g>

