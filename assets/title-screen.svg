      <circle class="star" cx="1002" cy="98" r="1.2" style="animation-delay: -1.5s"/>
      <circle class="star" cx="1150" cy="40" r="1.3" style="animation-delay: -2.1s"/>
      <circle class="star" cx="1176" cy="112" r="1" style="animation-delay: -.9s"/>
      <circle class="star" cx="472" cy="30" r="1" style="animation-delay: -2.6s"/>
      <circle class="star" cx="352" cy="46" r="1.1" style="animation-delay: -1.3s"/>
    </g>
    <circle cx="1084" cy="68" r="34" fill="#e8ecf4" opacity=".06"/>
    <circle cx="1084" cy="68" r="19" fill="#e8ecf4" opacity=".9"/>
    <circle cx="1076" cy="62" r="17" fill="#0d1320"/>

    <g mask="url(#skylineFade)">
      <g fill="#0d1220">
        <rect x="560" y="156" width="26" height="14"/>
        <rect x="590" y="144" width="18" height="26"/>
        <rect x="612" y="152" width="30" height="18"/>
        <rect x="646" y="132" width="22" height="38"/>
