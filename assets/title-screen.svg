    <rect x="64" y="72" width="9" height="9" fill="#c4f542"/>
    <text class="mono" x="84" y="81" font-size="14" letter-spacing="4" fill="#c4f542">PLAYER 1 READY</text>
    <text class="display" x="61" y="152" font-size="60" letter-spacing="1" fill="#e8ecf4">LALIT KUMAR</text>
    <text class="display" x="61" y="212" font-size="60" letter-spacing="1" fill="#c4f542">MEENA</text>
    <text class="mono" x="64" y="250" font-size="15" font-weight="400" fill="#939cb1">C++ and Qt by day. Gamer the rest of the time.</text>

    <g class="mono">
      <rect x="64" y="278" width="192" height="50" rx="6" fill="#11151d" stroke="#262d3d"/>
      <text x="78" y="297" font-size="9.5" letter-spacing="2" fill="#939cb1">CLASS</text>
      <text x="78" y="317" font-size="14.5" fill="#e8ecf4">C++ / Qt Engineer</text>
      <rect x="268" y="278" width="118" height="50" rx="6" fill="#11151d" stroke="#262d3d"/>
      <text x="282" y="297" font-size="9.5" letter-spacing="2" fill="#939cb1">REGION</text>
      <text x="282" y="317" font-size="14.5" fill="#e8ecf4">Pune, IN</text>
      <rect x="398" y="278" width="118" height="50" rx="6" fill="#11151d" stroke="#262d3d"/>
      <text x="412" y="297" font-size="9.5" letter-spacing="2" fill="#939cb1">XP SINCE</text>
      <text x="412" y="317" font-size="14.5" fill="#e8ecf4">Oct 2021</text>
      <text class="blink" x="64" y="366" font-size="13" letter-spacing="5" fill="#c4f542">&#9654; PRESS START</text>
