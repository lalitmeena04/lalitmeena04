        <rect x="1104" y="120" width="30" height="50"/>
        <rect x="1138" y="142" width="26" height="28"/>
        <rect x="1168" y="128" width="32" height="42"/>
      </g>
      <g fill="#ffcb47" opacity=".75">
        <rect x="651" y="140" width="2" height="2"/>
        <rect x="660" y="150" width="2" height="2"/>
        <rect x="715" y="132" width="2" height="2"/>
        <rect x="722" y="148" width="2" height="2"/>
        <rect x="772" y="124" width="2" height="2"/>
