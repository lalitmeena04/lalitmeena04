      <rect x="911" y="382" width="24" height="11" rx="3" fill="#05070b"/>
      <path d="M822 350 834 327Q837 321 844 321H896Q903 321 906 327L918 350Z" fill="#121722" stroke="#3a4560"/>
      <path d="M833 347 842 329H898L907 347Z" fill="#0a0d14"/>
      <path d="M838 347 845 333H862L856 347Z" fill="#4cc9ff" opacity=".12"/>
      <path d="M800 388 806 358Q808 350 818 349H922Q932 350 934 358L940 388Z" fill="#1a2030" stroke="#3a4560"/>
      <rect x="806" y="357" width="34" height="13" rx="3" fill="#ff5d73" opacity=".7" filter="url(#soft)"/>
      <rect x="900" y="357" width="34" height="13" rx="3" fill="#ff5d73" opacity=".7" filter="url(#soft)"/>
      <rect x="812" y="362.5" width="116" height="2" fill="#ff5d73" opacity=".45"/>
      <rect x="810" y="360" width="28" height="7" rx="2" fill="#ff5d73"/>
      <rect x="902" y="360" width="28" height="7" rx="2" fill="#ff5d73"/>
      <rect x="850" y="372" width="40" height="11" rx="1.5" fill="#e8ecf4"/>
      <text class="mono" x="870" y="380.5" font-size="7.5" text-anchor="middle" fill="#0b0d08">LM 04</text>
